## geometry
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
geometry.is_periodic = [1, 1, 1]

## resolution
amr.n_cell = [64, 8, 8]
amr.max_level = 0
amr.blocking_factor = 8
amr.max_grid_size = 128

## verbosity
amr.v = 0

## output
plotfile_interval = -1

## time integration
do_reflux = 0
do_subcycle = 0
cfl = 0.3

## hydro
hydro.rk_integrator_order = 2
hydro.reconstruction_order = 3
hydro.use_dual_energy = 0

## mhd
mhd.emf_compute_scheme = "Quokka2026"
mhd.emf_averaging_scheme = "LondrilloDelZanna2004"
mhd.emf_reconstruction_order = 3

## wave setup
setup.machine_precision_target = 0
setup.nx_max = 2048
