[project]
name = "kriel-2025-quokka-mhd"
version = "0.1.0"
description = "magnetising quokka code paper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jormi",
    "numpy>=2.3.2",
    "pandas>=3.0.0",
    "ww-quokka-sims",
    "yt>=4.4.1",
]

[tool.uv.sources]
jormi = { path = "../../sindri/submodules/jormi", editable = true }
ww-quokka-sims = { path = "../../sindri/submodules/ww-quokka-sims", editable = true }

[dependency-groups]
dev = ["basedpyright>=1.0"]

[tool.basedpyright]
include = ["scripts"]
exclude = ["scripts/datasets.gitignored"]
reportExplicitAny = "none"
reportAny = "none"
reportImplicitStringConcatenation = "none"
reportImplicitOverride = "none"
reportUnusedCallResult = "none"
