##
## === PACKAGE METADATA
##

[project]
name = "kriel-2025-quokka-mhd"
version = "0.1.0"
description = "magnetising quokka code paper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aegir",
    "jormi",
    "numpy>=2.3.2",
    "pandas>=3.0.0",
    "scipy>=1.15.2",
    "ww-quokka-sims",
    "yt>=4.4.1",
]

[tool.uv.sources]
aegir = { path = "../../sindri/submodules/aegir", editable = true }
jormi = { path = "../../sindri/submodules/jormi", editable = true }
ww-quokka-sims = { path = "../../sindri/submodules/ww-quokka-sims", editable = true }

##
## === DEVELOPMENT DEPENDENCIES
##

[dependency-groups]
dev = [
    "basedpyright>=1.0",
    "pytest>=9.0.2",
]

##
## === BUILD SYSTEM
##

## hatchling packages the source into a distributable wheel
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

## point hatchling to the importable source code
[tool.hatch.build]
sources = ["src"]

## explicit package path required: the source directory (local_helpers) does not share
## its name with the project (kriel-quokka-mhd), so hatchling cannot auto-detect it
[tool.hatch.build.targets.wheel]
packages = ["src/local_helpers"]

##
## === TYPE CHECKER (basedpyright)
##

[tool.basedpyright]
include = ["scripts", "src", "tools"]
exclude = ["scripts/datasets.gitignored"]
reportMissingTypeStubs = false  # suppress missing stub warnings for third-party packages (e.g. scipy)
reportExplicitAny = "none"
reportAny = "none"
reportImplicitStringConcatenation = "none"
reportImplicitOverride = "none"
reportUnusedCallResult = "none"
reportUnknownMemberType = "none"  # cascade from scipy's untyped stubs; not actionable
reportUnknownVariableType = "none"  # cascade from scipy's untyped stubs; not actionable
reportPrivateUsage = "none"  # tests legitimately access private members
reportUnknownArgumentType = "none"  # cascade from scipy's untyped stubs; not actionable
