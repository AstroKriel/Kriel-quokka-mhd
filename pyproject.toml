##
## === PACKAGE METADATA
##

[project]
name = "kriel-2025-quokka-mhd"
version = "0.1.0"
description = "magnetising quokka code paper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jormi",
    "numpy>=2.3.2",
    "pandas>=3.0.0",
    "scipy>=1.15.2",
    "ww-quokka-sims",
    "yt>=4.4.1",
]

[tool.uv.sources]
jormi = { path = "../../sindri/submodules/jormi", editable = true }
ww-quokka-sims = { path = "../../sindri/submodules/ww-quokka-sims", editable = true }

##
## === BUILD SYSTEM
##

## hatchling packages the source into a distributable wheel
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

## point hatchling to the importable source code
[tool.hatch.build]
sources = ["src"]

## project name doesn't match the package name, so point the wheel at it explicitly
[tool.hatch.build.targets.wheel]
packages = ["src/riemann_solver"]

##
## === DEVELOPMENT DEPENDENCIES
##

[dependency-groups]
dev = [
    "basedpyright>=1.0",
    "pytest>=9.0.2",
]

##
## === TEST RUNNER (pytest)
##

[tool.pytest.ini_options]
pythonpath = ["src"]  # makes src/ visible to pytest without installing the package
testpaths = ["utests"]  # vtests are run manually

##
## === TYPE CHECKER (basedpyright)
##

[tool.basedpyright]
include = ["src", "scripts", "utests", "vtests"]
exclude = ["scripts/datasets.gitignored"]
extraPaths = ["src"]
reportMissingTypeStubs = false  # suppress missing stub warnings for third-party packages (e.g. scipy)
reportExplicitAny = "none"
reportAny = "none"
reportImplicitStringConcatenation = "none"
reportImplicitOverride = "none"
reportUnusedCallResult = "none"
reportUnknownMemberType = "none"  # cascade from scipy's untyped stubs; not actionable
reportUnknownVariableType = "none"  # cascade from scipy's untyped stubs; not actionable
reportUnknownArgumentType = "none"  # cascade from scipy's untyped stubs; not actionable
